<!-- Swaram "Look at me" section for Framer. Paste into an Embed (HTML), width Fill, height about 620px. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#F3EEE8}
#swl{box-sizing:border-box;height:100%;background:#F3EEE8;font-family:Inter,system-ui,sans-serif;color:#141414;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:16px 48px;align-items:end;padding:64px max(24px,calc((100% - 1120px)/2)) 0}
#swl *{box-sizing:border-box}
#swl h2{grid-column:1;align-self:start;margin:0;font:800 clamp(38px,6vw,88px)/.95 Inter,sans-serif;letter-spacing:-.04em;text-transform:uppercase}
#swl h2 span{color:#b9b2a8}
#swl .hint{grid-column:1;align-self:start;margin:0;color:#8a8378;font-size:14px}
#swl button{grid-column:1;justify-self:start;align-self:start;margin-bottom:40px;font:600 14px Inter,sans-serif;border:2px solid #141414;background:#fff;border-radius:99px;padding:10px 20px;cursor:pointer}
#swl .stage{grid-column:2;grid-row:1/span 3;justify-self:center;align-self:end;width:min(440px,100%)}
#swl .kid{position:relative;aspect-ratio:320/380}
#swl .kid-frame{position:absolute;inset:0;width:100%;height:100%;visibility:hidden}
#swl .kid-frame.on{visibility:visible}
@media (max-width:720px){
  #swl{grid-template-columns:1fr;padding-top:48px;align-content:space-between}
  #swl h2,#swl .hint,#swl button{grid-column:1}
  #swl .stage{grid-column:1;grid-row:auto;width:min(320px,86%)}
  #swl button{margin-bottom:0}
}
</style>
<section id="swl" aria-label="Look at me">
  <h2>Let your children <span>see the true world.</span></h2>
  <p class="hint">(move your mouse, or tilt your phone)</p>
  <button type="button" id="swl-tilt" hidden>Tap to let him follow your phone</button>
  <div class="stage" role="img" aria-label="A Swaram kid who turns to look at you as you move">
    <div class="kid">
      <svg class="kid-frame" data-t="-1" viewBox="0 0 320 380" aria-hidden="true"><path d="M30 380 C38 304 96 272 160 272 C224 272 282 304 290 380 Z" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 278 Q160 304 196 278" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 236 L138 280 M182 236 L182 280" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="86" cy="182" rx="19" ry="24" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 174 q-6 8 0 16" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><ellipse cx="242" cy="182" rx="19" ry="24" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 174 q6 8 0 16" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><ellipse cx="156" cy="172" rx="80" ry="84" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 150 C66 78 108 52 148 52 C190 52 228 80 234 150 Z" fill="#141414" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M242 156 Q122 128 28 150 Q22 164 42 168 Q122 150 236 170 Z" fill="#141414" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="124" y="80" width="34" height="10" rx="5" fill="#fff"/><circle cx="108" cy="196" r="6" fill="#141414"/><circle cx="160" cy="196" r="6" fill="#141414"/><path d="M128 204 q-5 8 0 12" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M120 228 Q138 242 156 228" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/></svg>
      <svg class="kid-frame" data-t="0" viewBox="0 0 320 380" aria-hidden="true"><path d="M30 380 C38 304 96 272 160 272 C224 272 282 304 290 380 Z" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 278 Q160 304 196 278" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 236 L138 280 M182 236 L182 280" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="78" cy="182" rx="19" ry="24" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 174 q-6 8 0 16" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><ellipse cx="242" cy="182" rx="19" ry="24" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M246 174 q6 8 0 16" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><ellipse cx="160" cy="172" rx="80" ry="84" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 150 C80 78 122 52 162 52 C204 52 242 80 238 150 Z" fill="#141414" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 152 Q160 124 246 152 Q252 166 240 168 Q160 146 80 168 Q68 166 74 152 Z" fill="#141414" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="144" y="80" width="34" height="10" rx="5" fill="#fff"/><circle cx="134" cy="196" r="6" fill="#141414"/><circle cx="186" cy="196" r="6" fill="#141414"/><path d="M160 204 q5 8 0 12" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M142 228 Q160 242 178 228" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/></svg>
      <svg class="kid-frame" data-t="1" viewBox="0 0 320 380" aria-hidden="true"><path d="M30 380 C38 304 96 272 160 272 C224 272 282 304 290 380 Z" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 278 Q160 304 196 278" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 236 L138 280 M182 236 L182 280" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="78" cy="182" rx="19" ry="24" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M74 174 q-6 8 0 16" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><ellipse cx="234" cy="182" rx="19" ry="24" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M238 174 q6 8 0 16" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><ellipse cx="164" cy="172" rx="80" ry="84" fill="#fff" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 150 C94 78 136 52 176 52 C218 52 256 80 242 150 Z" fill="#141414" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 156 Q198 128 292 150 Q298 164 278 168 Q198 150 84 170 Z" fill="#141414" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="164" y="80" width="34" height="10" rx="5" fill="#fff"/><circle cx="160" cy="196" r="6" fill="#141414"/><circle cx="212" cy="196" r="6" fill="#141414"/><path d="M192 204 q5 8 0 12" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M164 228 Q182 242 200 228" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/></svg>
    </div>
  </div>
</section>
<script>
(function () {
  var box = document.querySelector("#swl .kid");
  var frames = {}, cur = null;
  [].forEach.call(box.querySelectorAll(".kid-frame"), function (f) { frames[f.dataset.t] = f; });
  function show(t) { if (t === cur) return; cur = t; for (var k in frames) frames[k].classList.toggle("on", +k === t); }
  show(0);
  function fromX(x) {                       // x in this frame's coordinates
    var r = box.getBoundingClientRect(), dx = x - (r.left + r.width / 2), zone = Math.max(60, r.width * 0.28);
    show(dx < -zone ? -1 : dx > zone ? 1 : 0);
  }
  addEventListener("pointermove", function (e) { fromX(e.clientX); }, { passive: true });
  // Framer puts Embeds in a frame: sit on the same layer as the template's sections (z-index 1),
  // so the sticky hero photo slides under this section instead of over it
  try {
    var up = window.frameElement;
    for (var i = 0; i < 4 && up && up.parentElement; i++) {
      up = up.parentElement;
      if (window.parent.getComputedStyle(up).position === "static") up.style.position = "relative";
      up.style.zIndex = "1";
    }
  } catch (e) {}
  // also follow the mouse anywhere on the page around it
  try {
    var fe = window.frameElement, pw = window.parent;
    if (fe && pw && pw !== window) pw.addEventListener("pointermove", function (e) { fromX(e.clientX - fe.getBoundingClientRect().left); }, { passive: true });
  } catch (e) {}
  function tilt(e) { if (e.gamma == null) return; show(e.gamma < -10 ? -1 : e.gamma > 10 ? 1 : 0); }
  var btn = document.getElementById("swl-tilt");
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
    btn.hidden = false;
    btn.onclick = function () { DeviceOrientationEvent.requestPermission().then(function (s) { if (s === "granted") { addEventListener("deviceorientation", tilt); btn.hidden = true; } }); };
  } else { addEventListener("deviceorientation", tilt); }
})();
</script>
