<!-- Swaram intro (preloader + sketchbook page) for Framer. Paste into an Embed (HTML) on the Home page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@100..800&family=La+Belle+Aurore&display=swap">
<style>
#swi{--ink:#141414;--red:#FF1A1A;--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);position:fixed;inset:0;z-index:2147483000;font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#7fb3e6;transition:opacity .6s ease,transform .8s var(--ease)}
#swi *{box-sizing:border-box}
#swi img{display:block;max-width:100%}
#swi.gone{opacity:0;transform:translateY(-4%);pointer-events:none}
#swi .sky{position:absolute;inset:-4%;background:url(https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/sky-bg.webp) center/cover no-repeat;animation:swiSky 40s ease-in-out infinite alternate}
@keyframes swiSky{from{transform:scale(1.04) translateX(-1.5%)}to{transform:scale(1.1) translateX(1.5%)}}
/* preloader */
#swi .ld{position:absolute;inset:0;z-index:5;background:#fff;display:grid;place-items:center;transition:transform 1s var(--ease) .1s,opacity .4s .9s}
#swi .ld.done{transform:translateY(-100%);opacity:0;pointer-events:none}
#swi .ld-in{display:grid;justify-items:center;gap:18px}
#swi .ld-logo{width:auto;height:170px;animation:swiIn 1.1s var(--spring) both,swiWob 2.2s ease-in-out 1.1s infinite alternate}
#swi .ld-word{margin:0;font:400 22px "JetBrains Mono",monospace;min-height:1.4em}
#swi .ld-word b{font-weight:700}
#swi .ld-bar{position:relative;width:220px;height:26px}
#swi .ld-bar span{position:absolute;left:0;top:12px;height:3px;width:var(--p,0%);background:var(--ink);border-radius:3px}
#swi .ld-bar img{position:absolute;top:0;left:calc(var(--p,0%) - 92px);width:96px;transform:rotate(-4deg)}
@keyframes swiIn{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
@keyframes swiWob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
/* top bar */
#swi .bar{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 28px}
#swi .bar-l{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
#swi .bar-l img{height:74px;width:auto}
#swi .brand{font:400 20px "JetBrains Mono",monospace;color:#3D5A1E;white-space:nowrap}
#swi .brand .l{display:inline-block;white-space:pre;font-weight:var(--wt,400);transition:font-weight .55s cubic-bezier(.45,0,.25,1)}
#swi .brand .gap{display:inline-block;width:var(--gw,.6ch);transition:width .55s cubic-bezier(.45,0,.25,1)}
#swi nav{display:flex;gap:36px}
#swi nav a{position:relative;text-decoration:none;color:var(--ink);font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em;padding:8px 0;cursor:pointer}
#swi nav a img{position:absolute;left:50%;top:calc(100% - 2px);width:130%;min-width:64px;max-width:none;transform:translate(-50%,-50%) scaleX(0) rotate(-3deg);transform-origin:left center;opacity:0;transition:transform .45s var(--ease),opacity .2s}
#swi nav a:hover img{transform:translate(-50%,-50%) scaleX(1) rotate(-3deg);opacity:1}
/* stage */
#swi .stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:70px}
#swi .book{position:relative;width:min(88vw,calc((100vh - 230px) * 1.82))}
#swi .book-img{width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 22px 22px rgba(30,60,120,.28))}
#swi .bk{position:absolute;left:var(--x);top:var(--y);width:var(--w);text-align:center;text-decoration:none;cursor:pointer;opacity:0;transform:rotate(calc(var(--r) - 30deg)) scale(1.8)}
#swi .bk img{width:100%;filter:drop-shadow(0 5px 6px rgba(0,0,0,.22))}
#swi .bk span{display:block;margin-top:-12%;font:600 clamp(9px,.8vw,13px) Inter,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
#swi.ready .bk{opacity:1;transform:rotate(var(--r));transition:transform .7s var(--spring),opacity .25s;transition-delay:calc(var(--i) * 110ms)}
#swi.ready .bk:hover{transform:rotate(calc(var(--r) * -1.6)) scale(1.12) translateY(-4%);transition:transform .45s var(--spring);z-index:5}
#swi.ready .bk.peel{animation:swiPeel .5s ease-in forwards}
@keyframes swiPeel{40%{transform:rotate(calc(var(--r) - 18deg)) scale(1.2) translateY(-12%)}100%{transform:rotate(calc(var(--r) + 30deg)) scale(.6) translateY(-80%);opacity:0}}
#swi .cta{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font:600 15px Inter,sans-serif;color:#fff;background:var(--ink);text-decoration:none;border-radius:99px;padding:14px 28px;cursor:pointer;opacity:0;transition:transform .45s var(--spring),opacity .6s 1.3s}
#swi.ready .cta{opacity:1}
#swi .cta:hover{transform:rotate(-3deg) scale(1.05)}
#swi .cue{margin:10px 0 0;color:#1f3f73;font:600 13px Inter,sans-serif}
@media (max-width:720px){
  #swi .bar{flex-wrap:wrap;row-gap:4px;padding:8px 14px}
  #swi .bar-l img{height:52px}
  #swi .brand{font-size:14px}
  #swi nav{gap:13px}
  #swi nav a{font-size:11px}
  #swi .stage{padding-top:96px}
  #swi .book{width:108vw;margin-left:-4vw;align-self:flex-start}
  #swi .bk span{font-size:10px}
  #swi .sky{background-size:240% auto;background-repeat:repeat}
}
@media (prefers-reduced-motion:reduce){#swi *{animation:none!important;transition:none!important}#swi .bk,#swi .cta{opacity:1;transform:rotate(var(--r,0deg))}}
</style>

<div id="swi" role="dialog" aria-label="Welcome to Swaram Early Years">
  <div class="sky" aria-hidden="true"></div>
  <div class="ld" aria-hidden="true">
    <div class="ld-in">
      <img class="ld-logo" src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/swaram-mark.webp" alt="">
      <p class="ld-word"></p>
      <div class="ld-bar"><span></span><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/pencil-1.webp" alt=""></div>
    </div>
  </div>
  <header class="bar">
    <a class="bar-l" data-go="close" aria-label="Swaram Early Years"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/swaram-mark.webp" alt=""><span class="brand">[Swaram Early Years]</span></a>
    <nav aria-label="Explore">

      <a data-go="Our Programs">Programs<img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/pencil-1.webp" alt=""></a>
      <a data-go="Highlights">Highlights<img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/pencil-1.webp" alt=""></a>
      <a data-go="/contact">Visit<img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/pencil-1.webp" alt=""></a>
    </nav>
  </header>
  <div class="stage">
    <div class="book">
      <img class="book-img" src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/girl-book-sky.webp" alt="A girl peeking over a big green sketchbook, with a sticky note that says Swaram Early Years" width="1355" height="743">
      <a class="bk" data-go="A Day at Swaram" style="--x:12.8%;--y:33.9%;--w:18.4%;--r:-5deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-day.webp" alt="A day at Swaram"></a>
      <a class="bk" data-go="Dear Parents" style="--x:32.3%;--y:32.6%;--w:13.3%;--r:4deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/hand-seed.webp" alt=""><span>Our story</span></a>
      <a class="bk" data-go="Discovering Their Inner Voice" style="--x:13.4%;--y:51.3%;--w:10.8%;--r:6deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-what.webp" alt="What we grow"></a>
      <a class="bk" data-go="Highlights" style="--x:25.5%;--y:52.8%;--w:9.9%;--r:-5deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-highlights.webp" alt="Highlights, beyond the classroom"></a>
      <a class="bk" data-go="Teachers" style="--x:36.0%;--y:57.8%;--w:12.2%;--r:3deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-teachers.webp" alt="Teachers"></a>
      <a class="bk" data-go="Our Programs" style="--x:57.3%;--y:36.0%;--w:16.4%;--r:-3deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-programs.webp" alt="Our programs"></a>
      <a class="bk" data-go="/contact" style="--x:76.6%;--y:31.0%;--w:14.2%;--r:-6deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/hand-pencil.webp" alt=""><span>Book a visit</span></a>
      <a class="bk" data-go="Every Child Has a Voice" style="--x:58.1%;--y:52.8%;--w:13.6%;--r:-4deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-lookme.webp" alt="Look at me"></a>
      <a class="bk" data-go="/about" style="--x:75.1%;--y:57.1%;--w:11.6%;--r:7deg"><img src="https://cdn.jsdelivr.net/gh/huzefakhanwork-ctrl/swaram-wireframe@07dd7d2/framer-intro/img/label-founder.webp" alt="Founder's note"></a>
    </div>
    <a class="cta" data-go="close">Visit the website <span aria-hidden="true">→</span></a>
    <p class="cue">(or tap a sticker on her sketchbook)</p>
  </div>
</div>

<script>
(function () {
  /* Framer runs Embed code inside its own frame. If so, move the intro onto the real page
     (the frame has the same origin) and hide the frame, so visitors can use the site after. */
  var win = window, doc = document;
  var src = document.getElementById("swi");
  if (!src) return;
  try {
    // inside the Framer editor canvas, stay in the box so the canvas stays editable
    var inEditor = /framercanvas\.com$|(^|\.)framer\.com$/.test(window.parent.location.hostname);
    if (!inEditor && window.frameElement && window.parent && window.parent.document) {
      win = window.parent; doc = win.document;
      var fe = window.frameElement, el = fe;
      for (var i = 0; i < 6 && el && el !== doc.body; i++) { el.style.pointerEvents = "none"; el = el.parentElement; }
      fe.style.display = "none";
    }
  } catch (e) { win = window; doc = document; }
  if (doc.getElementById("swi-on")) return;          // already running on this page
  var mark = doc.createElement("meta"); mark.id = "swi-on"; doc.head.appendChild(mark);
  if (doc !== document) {                             // copy the fonts, styles and markup across
    [].forEach.call(document.querySelectorAll("link[rel=stylesheet], style"), function (n) { doc.head.appendChild(doc.importNode(n, true)); });
  }
  var root = doc !== document ? doc.importNode(src, true) : src;
  doc.body.appendChild(root);
  if (doc !== document) src.remove();

  var reduce = win.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var html = doc.documentElement, prevOverflow = html.style.overflow;
  html.style.overflow = "hidden";

  /* preloader: type the name, draw the pencil line */
  var ld = root.querySelector(".ld"), word = root.querySelector(".ld-word"), bar = root.querySelector(".ld-bar");
  var text = "[Swaram Early Years]", bold = [1, 4, 5, 8, 11, 12, 15, 16], n = 0, start = win.performance.now(), MIN = reduce ? 0 : 2200;
  function tick(t) {
    var p = Math.min(1, (t - start) / MIN), k = Math.round(p * text.length);
    if (k !== n) { n = k; word.innerHTML = text.slice(0, n).split("").map(function (c, i) { return bold.indexOf(i) > -1 ? "<b>" + c + "</b>" : c; }).join(""); }
    bar.style.setProperty("--p", (p * 100).toFixed(1) + "%");
    if (p < 1) return win.requestAnimationFrame(tick);
    win.setTimeout(function () { ld.classList.add("done"); win.setTimeout(function () { root.classList.add("ready"); }, 300); }, 250);
  }
  win.requestAnimationFrame(tick);

  /* the [Swaram Early Years] letters change weight one by one */
  var brand = root.querySelector(".brand"), BT = brand.textContent;
  brand.innerHTML = BT.split("").map(function (c) { return c === " " ? '<span class="gap"></span>' : '<span class="l">' + c + "</span>"; }).join("");
  var ls = [].slice.call(brand.querySelectorAll(".l")), gaps = [].slice.call(brand.querySelectorAll(".gap")), W = [200, 300, 400, 500, 700, 800];
  function morph() {
    ls.forEach(function (l) { if (Math.random() < 0.55) l.style.setProperty("--wt", W[Math.floor(Math.random() * W.length)]); });
    gaps.forEach(function (g) { if (Math.random() < 0.5) g.style.setProperty("--gw", (0.35 + Math.random() * 1.1).toFixed(2) + "ch"); });
  }
  morph(); var mt = reduce ? 0 : win.setInterval(morph, 520);

  /* stickers, menu and button: close the intro, then go to the section or page */
  [].forEach.call(root.querySelectorAll(".bk"), function (a, i) { a.style.setProperty("--i", i); });
  function close(then) {
    root.classList.add("gone"); html.style.overflow = prevOverflow;
    win.setTimeout(function () { win.clearInterval(mt); root.remove(); if (then) then(); }, reduce ? 0 : 650);
  }
  function findHeading(txt) {
    txt = txt.toLowerCase();
    return [].slice.call(doc.querySelectorAll("h1,h2,h3")).filter(function (h) { return !root.contains(h) && h.textContent.trim().toLowerCase().indexOf(txt) === 0; })[0];
  }
  root.addEventListener("click", function (e) {
    var a = e.target.closest("[data-go]"); if (!a) return;
    e.preventDefault();
    var go = a.dataset.go;
    if (a.classList.contains("bk") && !reduce) a.classList.add("peel");
    win.setTimeout(function () {
      if (go === "close") return close();
      if (go.charAt(0) === "/") return close(function () { win.location.href = go; });
      var h = findHeading(go);
      close(function () {
        if (!h) return;
        win.scrollTo(0, h.getBoundingClientRect().top + win.pageYOffset - 110);
        win.setTimeout(function () { win.scrollTo(0, h.getBoundingClientRect().top + win.pageYOffset - 110); }, 400); // again, after lazy sections settle
      });
    }, a.classList.contains("bk") ? 380 : 0);
  });
})();
</script>
